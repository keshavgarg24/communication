<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchase Template</title>
</head>

<body style="margin:0;padding:0;background:#0b0b0f;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0b0b0f">
    <tr>
      <td align="center">

        <table width="640" cellpadding="0" cellspacing="0" border="0"
          style="max-width:640px;width:100%;background:#111116;border-collapse:collapse;">

          <!-- Top Accent -->
          <tr>
            <td height="4" bgcolor="#7000FF"></td>
          </tr>

          <!-- Logo -->
          <tr>
            <td style="padding:36px 40px 24px 40px;">
              <img src="https://cdn.illpeoplemusic.com/imgs/logo-main.png"
                width="120"
                alt="Beat22"
                style="display:block;border:0;">
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 40px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td height="1" bgcolor="#1f1f26"></td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Header -->
          <tr>
            <td style="padding:40px 40px 24px 40px;font-family:Arial,Helvetica,sans-serif;">

              <div style="font-size:11px;font-weight:bold;letter-spacing:2px;color:#9040ff;margin-bottom:14px;">
                YOUR CART
              </div>

              <div style="font-size:24px;color:#ffffff;font-weight:bold;margin-bottom:22px;">
                You left some brilliant ideas behind!
              </div>

              <div style="font-size:14px;color:#c8c8c8;line-height:1.7;margin-bottom:8px;">
                Hey <strong style="color:#ffffff;">{{name}}</strong>,
              </div>

              <div style="font-size:14px;color:#c8c8c8;line-height:1.7;">
                You left some brilliant ideas in your cart. Convert them into tracks now!
              </div>

            </td>
          </tr>

          <!-- Cart Card -->
          <tr>
            <td style="padding:0 40px 24px 40px;">

              <table width="100%" cellpadding="0" cellspacing="0"
                style="background:#1a1a22;border-radius:6px;">

                <!-- Cart Header Row -->
                <tr>
                  <td style="padding:16px 20px;font-family:Arial,Helvetica,sans-serif;border-bottom:1px solid #2a2a34;">
                    <table cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="font-size:13px;font-weight:bold;color:#ffffff;padding-right:10px;">
                          Cart
                        </td>
                        <td>
                          <span style="background:#7000FF;border-radius:50%;color:#ffffff;font-size:11px;font-weight:bold;font-family:Arial,Helvetica,sans-serif;width:20px;height:20px;display:inline-block;text-align:center;line-height:20px;">
                            {{beat_count}}
                          </span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Beats List -->
                <tr>
                  <td style="padding:16px 20px;font-family:Arial,Helvetica,sans-serif;">

                    <table width="100%" cellpadding="0" cellspacing="0">
                      {% for beat in beats %}
                      <tr>
                        <td style="padding-bottom:14px;vertical-align:middle;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="vertical-align:middle;">
                                <img src="{{beat["cover_picture"]}}"
                                  width="40" height="40"
                                  alt="beat-cover"
                                  style="display:block;border-radius:5px;border:0;" />
                              </td>
                              <td style="vertical-align:middle;padding-left:12px;">
                                <div style="font-size:14px;color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
                                  {{beat["title"]}}
                                </div>
                              </td>
                            </tr>
                          </table>
                        </td>
                        <td style="text-align:right;vertical-align:middle;">
                        </td>
                      </tr>
                      {% endfor %}
                    </table>

                  </td>
                </tr>

              </table>

            </td>
          </tr>

          <!-- CTA Button -->
          <tr>
            <td align="center" style="padding:0 40px 16px 40px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#7000FF" style="border-radius:28px;">
                    <a href="https://beat22.com/cart"
                      target="_blank"
                      style="display:inline-block;padding:14px 30px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#ffffff;text-decoration:none;font-weight:bold;">
                      Checkout
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Finish Purchase Link -->
          <tr>
            <td align="center" style="padding:0 40px 40px 40px;font-family:Arial,Helvetica,sans-serif;">
              <a href="https://beat22.com/cart"
                target="_blank"
                style="color:#bda8ff;text-decoration:none;font-size:13px;font-weight:bold;">
                Finish your purchase now! →
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:30px 40px;background:#0f0f14;border-top:1px solid #1a1a22;">

              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>

                  <td align="left">
                    <a href="https://x.com/beat22__" style="text-decoration:none;">
                      <img src="https://cdn.illpeoplemusic.com/imges/imgs/twitter-icon.png"
                        width="18" style="margin-right:10px;border:0;">
                    </a>
                    <a href="https://www.facebook.com/Beat22app/" style="text-decoration:none;">
                      <img src="https://cdn.illpeoplemusic.com/imges/imgs/facebook-icon.png"
                        width="18" style="margin-right:10px;border:0;">
                    </a>
                    <a href="https://www.instagram.com/beat22__" style="text-decoration:none;">
                      <img src="https://cdn.illpeoplemusic.com/imges/imgs/instagram-icon.png"
                        width="18" style="border:0;">
                    </a>
                  </td>

                  <td align="right" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#9a9a9a;">
                    <a href="mailto:support@beat22.com" style="color:#9a9a9a;text-decoration:none;">
                      support@beat22.com
                    </a>
                  </td>

                </tr>
              </table>

            </td>
          </tr>

          <!-- Bottom Accent -->
          <tr>
            <td height="4" bgcolor="#7000FF"></td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
